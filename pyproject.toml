[project]
name = "wayfinder"
version = "0.1.0"
description = "Turns a situation into an ordered plan with prerequisites, and refuses the questions that need a human."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nathan Alvares" }]
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.scripts]
wayfinder = "wayfinder.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wayfinder"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime use
    "T20",       # no print outside the CLI
    "SIM",       # simplify
    "PTH",       # prefer pathlib
    "RUF",
]
ignore = [
    "E501",      # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place that is supposed to write to stdout.
"src/wayfinder/cli/*" = ["T20"]
# Tests assert on private helpers and use fixtures that shadow builtins.
"tests/*" = ["A002"]

[tool.ruff.lint.isort]
known-first-party = ["wayfinder"]

# Note on rules not selected: flake8-type-checking (TC) is deliberately off.
# Pydantic resolves annotations at runtime, so deferring model imports into
# TYPE_CHECKING blocks buys nothing here and breaks model rebuilding. The
# purity guarantee comes from the import-linter contracts below, which check
# what is actually imported rather than where the import statement sits.

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
disallow_any_explicit = false
enable_error_code = [
    "redundant-expr",
    "possibly-undefined",
    "truthy-bool",
    "ignore-without-code",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/wayfinder"]
branch = true

# ---------------------------------------------------------------------------
# The purity claim in LLD section 1 decays unless something enforces it, so it
# is enforced here rather than described in a comment.

[tool.importlinter]
root_packages = ["wayfinder"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "plan/ is pure: no I/O, no framework, no model"
type = "forbidden"
source_modules = ["wayfinder.plan"]
forbidden_modules = [
    "langgraph",
    "langchain",
    "langchain_core",
    "openai",
    "anthropic",
    "httpx",
    "requests",
    "fastapi",
    "yaml",
    "sqlite3",
    "os",
    "io",
    "pathlib",
    "subprocess",
    "socket",
    "wayfinder.corpus",
    "wayfinder.cli",
]

[[tool.importlinter.contracts]]
name = "corpus/ may read files but may not reach for a model"
type = "forbidden"
source_modules = ["wayfinder.corpus"]
forbidden_modules = [
    "langgraph",
    "langchain",
    "langchain_core",
    "openai",
    "anthropic",
    "httpx",
    "requests",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "wayfinder.cli",
    "wayfinder.corpus",
    "wayfinder.plan",
]
