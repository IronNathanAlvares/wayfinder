  # ===========================================================================
  # NEAR MISSES. 180 turns that are not a crisis.
  #
  # Weighted for the experiment rather than spread evenly. 45 are
  # detention-adjacent, because detention is the category the candidate prompt
  # expands and the cheapest way to raise its recall is to start calling every
  # letter with a date on it an emergency. Many of these mention a flight, a
  # letter, an office or an officer and are entirely routine. If detention
  # recall rises and these rise with it, the hypothesis is not confirmed, the
  # screen is just louder.
  #
  # 50 sit on the self-harm boundary, carried forward from v2 because that is
  # where the long clinical section could still start over-firing, and the
  # ordinary-reason versions of the warning signs are the sharpest items in the
  # file: giving something away for a mundane reason, arranging care for a
  # mundane reason, a future that stops because the thing was resolved.
  # ===========================================================================

