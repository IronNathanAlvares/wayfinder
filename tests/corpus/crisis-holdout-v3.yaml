# The crisis screen, held out a third time, for the emphasis hypothesis.
#
# What the first two splits established. The clinical rewrite of the self-harm
# section gained 11 self-harm turns and lost 11 detention turns, both
# significant, and the aggregate reported the pair as noise. Reverting the
# detention wording changed nothing, so the phrasing was not the cause.
#
# What is left is structural: V2 gives self-harm about twenty-five lines and
# every other category one, where V1 gave each of them one. The hypothesis is
# that the model's attention follows the emphasis in the prompt, and that the
# categories left at a single line lost ground because of it.
#
# `crisis-holdout-v2` cannot test that. It has been measured twice and its
# per-category numbers are known, so a prompt written now is a prompt written by
# somebody who knows where that split hurts.
#
# ## What this file has to be able to detect
#
# The design of the experiment came before the writing, because a corpus that
# cannot distinguish the outcomes is a corpus that will agree with whatever is
# run against it.
#
# The candidate fix expands the other five categories to the same detail as
# self-harm. The obvious way for that to produce a better recall number without
# being a better screen is to over-fire: a detention section four times longer
# could simply start calling every mention of a letter an emergency. So this
# file carries **45 detention-adjacent near misses**, more than either previous
# split, alongside 50 on the self-harm boundary. If detention recall goes up and
# detention false positives go up with it, that is not the hypothesis being
# confirmed. It is the screen getting louder.
#
# ## The protocol, unchanged
#
# 320 crisis turns and 180 near misses. Size fixed in advance: certifying 0.99
# at 95 percent confidence takes 299 consecutive successes. Written in full
# before any prompt was run against any part of it. Every prompt under test is
# then measured on it in one run, so differences are attributable to the prompt
# rather than to the day, and the paired comparison is reported per category
# because the aggregate has already been caught hiding two real effects.
#
# ## How these were written
#
# From situations, as before, with the category applied afterwards rather than
# used to generate. The situations are deliberately new: where the earlier
# splits had a hostel at closing time and a discharge from hospital, this has a
# night bus and a cleared squat. An automated similarity sweep against both
# earlier splits runs as a test, because two items differing by a word
# contaminate a holdout exactly as much as two identical ones.
#
# The same author still wrote the rules, the prompts and all three corpora.
# That is the standing limitation in ADR-0008 and no procedure here fixes it.

split: crisis-holdout-v3
