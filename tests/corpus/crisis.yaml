# Every category, direct and indirect phrasing, plus non-native phrasing.
#
# The gate on this split is recall 0.99 with no precision gate. The cost matrix
# is not symmetric and the design does not pretend it is.
#
# Non-native phrasing is the weakest area and it is represented here on purpose,
# so that the weakness shows up as a number rather than as an assumption.

