# The crisis screen, held out a fourth time, for per-category screening.
#
# Three rounds of prompt work established that the categories compete. Giving
# detention its own section took it from 0.796 to 1.000 (p=0.0010) and expanding
# the other four then cost self-harm (p=0.0156). Attention behaves like a budget
# and the categories were spending each other's.
#
# The question this split exists to answer: is that competition an artefact of
# asking one call to hold six categories at once? Screening each category in its
# own call removes the competition by construction. Whether it also removes the
# losses is a measurement.
#
# ## Why the near misses grew to 200
#
# Because the risk changed shape. A single call has one chance to say yes
# wrongly. Six calls have six, and they are independent, so a per-category
# screen could reach a better recall number purely by having more opportunities
# to over-fire. That failure would look like success in every recall column.
#
# So this split carries 200 near misses rather than 180, spread roughly evenly
# across all six category boundaries rather than weighted toward one. Each of
# the six calls has its own traps: routine questions about removals, about
# refuges, about school, about medication, about grief, about housing lists.
# Precision is the number to read first this time.
#
# ## The protocol, unchanged
#
# 320 crisis turns and 200 near misses. Size fixed in advance: certifying 0.99
# at 95 percent confidence takes 299 consecutive successes. Written in full
# before any screen was run against any part of it. Every arm is measured on it
# in one run and compared pairwise per category, because the aggregate has been
# caught in this project hiding two real and opposite effects.
#
# ## How these were written
#
# From situations, with the category applied afterwards. The situations are new
# again: where the earlier splits had a hostel at closing time, a discharge from
# hospital and a night bus, this has a psychiatric discharge, a room let twice
# and a landlord who died. A symmetric similarity sweep against all three
# earlier splits runs as a test.
#
# The same author still wrote the rules, every prompt and all four corpora,
# which is the standing limitation in ADR-0008 and the honest discount on every
# number here.

