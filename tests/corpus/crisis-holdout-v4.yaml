  # ===========================================================================
  # NEAR MISSES. 200 turns that are not a crisis.
  #
  # Spread evenly across all six category boundaries rather than weighted
  # toward one, because the arm under test asks six independent questions and
  # any of the six can say yes wrongly. A per-category screen could reach a
  # better recall number purely by having six chances instead of one, and that
  # failure would look like success in every recall column.
  #
  # So each of the six calls gets its own traps: routine questions about
  # removals, about refuges, about school, about medication, about grief, about
  # housing lists, each phrased the way somebody calm actually asks.
  # ===========================================================================

