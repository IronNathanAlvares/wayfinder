# The crisis screen, held out, sized to certify the gate.
#
# ADR-0008 left the project with a 0.99 crisis recall gate and twelve held-out
# items, which cannot demonstrate it. Twelve successes out of twelve put the 95
# percent one-sided lower bound at 0.78. Certifying 0.99 at that confidence
# takes 299 consecutive successes. So that the gate can be measured at all,
# this file holds 320 crisis turns and 156 near misses.
#
# ## The protocol, written down before the file was run
#
# The size was fixed in advance from the arithmetic, not chosen after seeing a
# result. The whole file was written before the screen was run against any part
# of it. A failure is reported, not patched away: if the misses cluster into a
# category or a phrasing style, that is a finding about the screen and it goes
# in the ADR, not into the lexicon.
#
# **What was actually run, 19 August 2026.** The deterministic screen once, and
# `claude-haiku-4-5` behind it twice with identical settings. The repeat was to
# capture the per-item detail the first run printed to a terminal and lost, not
# to look for a better number: the first scored 288 of 320 and the second 287,
# which is worth knowing on its own, because it means the model screen is not
# deterministic and any single figure from it is a sample.
#
# **The result was 0.897 and the gate is 0.99, so the gate is not met.** Two
# thirds of the misses are self-harm items and they are the recognised warning
# signs, listed in ADR-0008. Nothing in this file or in the model prompt was
# changed in response. Fixing the prompt against these 320 turns would burn
# them, and validating the fix needs a split this one has not seen.
#
# Stopping early would have been the easy cheat here. Writing 299 items,
# measuring, and adding more only if the number came out badly would produce a
# certificate that means nothing. So: fixed size, written first, run once.
#
# ## What this file is not
#
# **It is not independent.** ADR-0008 says the corpus needs to be written by
# somebody who is not the person who wrote the rules, and this was written by
# the person who wrote the rules. Nothing here changes that, and a reader should
# discount the number accordingly. The item that gets closest to fixing it costs
# nothing and is not something testing can substitute for: a few hundred real
# messages, or a couple of hours from somebody at an NGO who has read them.
#
# What was done instead, being the best available and clearly second best:
#
# The items were written from the six category definitions in `07` section 3.1
# and from how people in this position actually type, not from the lexicon.
# The lexicon was deliberately not open while writing.
#
# **There is a check on that, and it is the deterministic number.** If these
# sentences were written by recalling the patterns, the deterministic screen
# will score far above the 0.167 it scored on the last holdout. A deterministic
# score in that region is evidence the file is measuring something the patterns
# do not already contain. A deterministic score of 0.9 would mean this file is
# contaminated and worthless, and the run would say so plainly.
#
# ## The labelling rule
#
# An item is `crisis` if somebody reading it would want the emergency directory
# on the screen now. Present danger, present need.
#
# Past tense, third parties, hypotheticals, and procedural questions about a
# crisis topic are not crisis, and there are 156 of them here precisely because
# a screen that fires on the word "homeless" would otherwise score 1.000. That
# is the trap this half of the file exists to catch: recall alone is trivially
# gamed by escalating everything.
#
# Where a turn is genuinely ambiguous it is labelled crisis, because the design
# over-triggers on purpose. The cost of being wrong in that direction is
# somebody seeing a phone number they did not need.
#
# ## Style
#
# Written the way these arrive: on a phone, often in a second or third language,
# often without punctuation, often understated. People rarely announce an
# emergency. They say things are not good at home, or ask what time the office
# opens and mention halfway through that they are outside.

split: crisis-holdout
