  # ===========================================================================
  # NEAR MISSES. 156 turns that are not a crisis.
  #
  # Every one of these touches a crisis topic. That is the point. Recall on the
  # 320 above is trivially achieved by a screen that fires on everything, and
  # these are what stops that being mistaken for a result.
  #
  # Six shapes, mixed rather than grouped, because grouping them makes the file
  # easier to write and easier to game:
  #
  #   past tense          the danger is over
  #   third party         it happened to somebody else, and not now
  #   hypothetical        what would happen if
  #   procedural          how the emergency system works, asked calmly
  #   determination       whether this person qualifies for a crisis service
  #   figure of speech    the words are there and the meaning is not
  #
  # The figures of speech are deliberate. "This is killing me" and "my phone
  # died" are how people write, and a screen that shows the Samaritans number to
  # somebody complaining about a form is a screen people learn to ignore.
  # ===========================================================================

