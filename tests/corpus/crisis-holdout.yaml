  # Almost never stated plainly. It arrives as exhaustion, as apology, as
  # putting affairs in order, as a question about who would take the children.
  # The items that say it outright are the easy ones and there are few of them
  # here on purpose, because the screen already catches those and the ones that
  # matter are the rest.
  #
  # The near misses for this category are the hardest in the file: grief,
  # ordinary despair about paperwork, and figures of speech that use the same
  # words. Getting those wrong in the safe direction is fine. Getting the ones
  # below wrong is not.
  # ---------------------------------------------------------------------------

