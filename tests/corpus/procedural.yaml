# Genuinely answerable questions. Process, documents, places, order.
#
# Gate: precision 0.90, deliberately the loosest of the three. The system is
# allowed to be annoying. It is not allowed to be dangerous.
#
# Several of these contain "I" on purpose. First person alone is not the signal,
# and a classifier that treats it as one escalates most of the answerable
# questions in this file.

