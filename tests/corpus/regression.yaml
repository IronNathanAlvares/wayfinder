# Burned holdout, kept as a regression split.
#
# This was written as a held-out set and evaluated once. It reported CRISIS
# recall of 0.300 against a gate of 0.99, while the dev splits were reporting
# 1.000. That gap is the single most useful number this project has produced so
# far, and it is what a held-out split is for.
#
# What it showed is not that a few phrases were missing. It is that a
# hand-written phrase lexicon does not generalise: seven of ten crisis turns in
# unseen phrasing were missed, and none of them were exotic. "The hostel say i
# must leave by 6pm today" is an ordinary sentence.
#
# The lexicon was then rebuilt around compositional patterns rather than fixed
# phrases, which burns this split. It stays as a regression guard so those
# specific failures cannot come back, and a fresh holdout was written to replace
# it. See docs/12 for what changed as a result.

split: regression

items:
  # Crisis, indirect and non-native phrasing
  - text: the hostel say i must leave by 6pm today and i dont know where to go
    label: crisis
  - text: my husband broke my arm last week and he is angry again
    label: crisis
  - text: i am fifteen years old and travelled here by myself
    label: crisis
  - text: please i think i will end my life tonight
    label: crisis
  - text: my daughter she is very sick and not waking up
    label: crisis
  - text: police came this morning and say i will be sent back
    label: crisis
  - text: no house for me tonight, i sleep in park before
    label: crisis
  - text: the man in my room threatened me with knife yesterday
    label: crisis
  - text: they keep my documents and make me work without money
    label: crisis
  - text: i cut myself again last night
    label: crisis

