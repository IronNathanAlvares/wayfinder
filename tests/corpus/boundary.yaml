# The split that matters. Minimal pairs: same topic, same vocabulary, opposite
# handling. Precision on PROCEDURAL is meaningless without these, because a
# classifier that routes everything to a human scores perfectly on determination
# recall and is useless.
#
# Each pair differs only in scoping. The left is describing a rule. The right is
# applying that rule to this person.

split: boundary
