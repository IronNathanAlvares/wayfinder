name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --all-extras so the optional model adapter is type-checked and tested
      # too. An adapter that only compiles on the author's machine is not
      # checked, and this one sits in the crisis path.
      - name: Install Python and dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: ruff format
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

      - name: mypy strict
        run: uv run mypy

      - name: import-linter
        run: uv run lint-imports

      - name: pytest
        # The floor is a ratchet, not a target. It exists so coverage cannot
        # drift down unnoticed while somebody adds code in a hurry.
        run: uv run pytest --cov --cov-fail-under=90

      # The corpus is content, and content rots. This runs against the shipped
      # corpus rather than a fixture, so a source ageing past a year fails the
      # build rather than waiting for somebody to notice.
      - name: corpus integrity and staleness
        run: |
          uv run wayfinder corpus check
          uv run wayfinder corpus health

      # The classifier is a model, so it gets a gate. This checks against the
      # committed baseline rather than the design targets, because the design
      # targets are not met and a permanently red build gets ignored. The
      # baseline file records the real numbers and says the targets are unmet.
      # See docs/adr/ADR-0008.
      - name: safety eval, no regression against the baseline
        run: uv run wayfinder-eval --baseline --show-failures 0

      # Proves the corpus data actually ships. It lives outside the Python
      # package tree conceptually, and a packaging mistake there is invisible
      # until somebody installs it.
      - name: the built wheel works without the repo
        run: |
          uv build --out-dir dist
          WHEEL=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" wayfinder --today 2026-08-18 corpus check

      # The demo site is a recording of the system, and a recording goes stale
      # silently. This regenerates it and fails if the committed file differs,
      # so the page cannot keep describing a system that changed underneath it.
      - name: the demo site still matches the system
        run: |
          uv run python scripts/build_site_data.py
          git diff --exit-code -- site/data.js

  # A Dockerfile that has only ever been read is not a Dockerfile that works.
  # This builds it and runs a real turn through the container, including the
  # refusal to start without a crisis screen, which is the behaviour the image
  # exists to enforce.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t wayfinder:ci .

      - name: It refuses to start without a working crisis screen
        run: |
          if docker run --rm wayfinder:ci; then
            echo "the container started with the deterministic screen alone" >&2
            exit 1
          fi

      - name: A turn goes through the container
        run: |
          docker run --rm -d --name wf -p 8000:8000 wayfinder:ci \
            wayfinder --today 2026-08-18 serve --host 0.0.0.0 \
            --no-model-screen --db /data/ci.sqlite
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8000/v1/corpus/health >/dev/null && break
            sleep 1
          done
          curl -sf -X POST http://127.0.0.1:8000/v1/threads \
            -H 'content-type: application/json' -d '{"thread_id":"ci"}'
          curl -sf -X POST http://127.0.0.1:8000/v1/threads/ci/turn \
            -H 'content-type: application/json' \
            -d '{"question":"am I entitled to a medical card"}' \
            | grep -q waiting_for_a_person
          docker rm -f wf
