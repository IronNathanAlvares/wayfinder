# Seed corpus for Ireland. Ten tasks, every one cited to a source that was
# actually fetched and read. See ../README.md for what this is and is not.
#
# Deliberately absent: amounts, rates and thresholds. They change most often and
# are exactly what people plan around, so a stale one does the most damage. The
# tasks say a payment exists and where to ask; they do not say what it pays.

- id: protection.apply
  title: Make your international protection application
  domain: status
  why: >
    Almost everything else starts here. This is how you get the certificate
    people will ask you for. It is also how you get the letter other services
    want to see.
  produces:
    - document:temporary_residence_certificate
    - document:asylum_application_letter
  blocking_severity: critical
  where:
    - source_id: nasc.asylum_ireland
      span: Application Process

- id: ppsn.apply
  title: Apply for your PPS number
  domain: status
  why: >
    Ask for this when you make your protection application. Almost everything in
    the welfare system needs it.
  requires:
    - ref: document:asylum_application_letter
      note: >
        The Irish Refugee Council describes applying at the same time as the
        protection application, at the International Protection Office or
        Citywest, then collecting the number from a local office.
  produces:
    - document:ppsn
  typical_wait: P4D
  blocking_severity: critical
  where:
    - source_id: irc.ppsn
      span: Application Process
    - source_id: irc.homeless
      span: Getting Financial Support

- id: ipas.request_accommodation
  title: Ask IPAS for accommodation and get on the waiting list
  domain: accommodation
  why: >
    IPAS works from a waiting list. They contact people by email. Being on that
    list, with an email they can reach, is the part you control.
  applies_when:
    holds: status:ipas_accommodation
    is: false
  requires:
    - ref: document:asylum_application_letter
      note: Write to IPAS with your full name and Person ID.
  blocking_severity: critical
  where:
    - source_id: irc.homeless
      span: Accessing Accommodation
    - source_id: unhcr.accommodation
      span: If Currently Homeless

- id: accommodation.move_in
  title: Take up the accommodation you are offered
  domain: accommodation
  why: >
    An offer comes by email. That is why checking your email every day matters
    more than it sounds.
  produces:
    - status:ipas_accommodation
  requires:
    - determination:ipas_accommodation_offer
  blocking_severity: critical
  where:
    - source_id: irc.homeless
      span: Accessing Accommodation

- id: address.an_post_point
  title: Register for An Post Address Point
  domain: accommodation
  why: >
    It is free and you can do it today. It gives you an address where post can
    reach you.
  applies_when:
    field: accommodation
    in: [homeless, staying_with_others, emergency]
  produces:
    - document:proof_of_address
  blocking_severity: important
  where:
    - source_id: irc.homeless
      span: Securing Proof of Address

- id: address.welfare_statement
  title: Ask the Community Welfare Service for a statement
  domain: accommodation
  why: >
    A social welfare statement works as proof of address. It is a second way in
    if the post office option does not suit you.
  requires:
    - document:ppsn
  produces:
    - document:proof_of_address
  blocking_severity: routine
  where:
    - source_id: irc.homeless
      span: Securing Proof of Address

- id: payment.weekly
  title: Ask about the weekly payment
  domain: income
  why: >
    This is the payment most people ask about. You need your PPS number for it.
    You also need something that shows you are on the IPAS list.
  requires:
    - document:ppsn
    - ref: document:asylum_application_letter
      note: Used to show you are on the IPAS waiting list.
  blocking_severity: critical
  where:
    - source_id: irc.homeless
      span: Getting Financial Support

- id: payment.additional_needs
  title: Ask about an Additional Needs Payment
  domain: income
  why: >
    This is for one-off costs you cannot avoid. It is separate from the weekly
    payment. Being turned down for one does not settle the other.
  requires:
    - document:ppsn
  blocking_severity: important
  where:
    - source_id: irc.homeless
      span: Getting Financial Support

- id: medical_card.apply
  title: Apply for a medical card
  domain: health
  why: >
    A medical card means you are seen without paying. Apply early. It does not
    come through straight away.
  requires:
    - document:ppsn
  produces:
    - document:medical_card
  blocking_severity: important
  where:
    - source_id: unhcr.accommodation
      span: Financial Support & Services

- id: work.labour_market_access
  title: Apply for permission to work
  domain: status
  why: >
    There is a waiting period. It starts the day you applied. Once it has passed,
    you apply online.
  requires:
    - document:temporary_residence_certificate
    - any_of: [elapsed:protection_application_date]
      after: P180D
      note: >
        Nasc describes a six month wait for a first instance decision before
        labour market access can be applied for. The period runs from the
        protection application, not from arrival.
  produces:
    - status:labour_market_access
  blocking_severity: important
  where:
    - source_id: nasc.asylum_ireland
      span: Work Rights

# --- income ----------------------------------------------------------------

- id: child_benefit.apply
  title: Apply for child benefit
  domain: income
  why: >
    This is the payment most families ask about. Part of the decision is not
    yours to settle.
  applies_when:
    child_aged:
      min: 0
      max: 17
  requires:
    - document:ppsn
    - ref: determination:habitual_residence
      note: >
        Assessed by a statutorily appointed Deciding Officer on five factors:
        length and continuity of residence, length and purpose of any absence,
        nature and pattern of employment, main centre of interest, and future
        intentions. Not all of them have to be satisfied. Nothing in this system
        decides it.

        Citizens Information states plainly that asylum seekers are not regarded
        as habitually resident. That is the single most important sentence on
        this page for anybody using this system, and it is why the answer here
        so often turns on protection status rather than on the five factors. It
        is still a determination and still not ours: what counts as an asylum
        seeker, when that stops applying, and what a particular person's status
        is on a particular day are all judgements made by a named authority.
  blocking_severity: critical
  where:
    - source_id: citizensinformation.habitual_residence
      span: Rules for satisfying the habitual residence condition
    - source_id: crosscare.habitual_residence
      span: Five Assessment Factors

- id: appeal.social_welfare
  title: Appeal a social welfare refusal
  domain: income
  why: >
    A refusal is not the end of it. You appeal to the Social Welfare Appeals
    Office, which is independent of the office that refused you.
  requires:
    - document:ppsn
  typical_wait: P90D
  # The window, as a window rather than a sentence. `typical_wait` above is how
  # long the appeal takes once lodged; this is how long you have to lodge it,
  # and they are opposite quantities. Citizens Information, read 24 August 2026.
  deadline:
    within: P60D
    of: determination:habitual_residence
    described_as: the date on the decision letter
  blocking_severity: important
  where:
    - source_id: citizensinformation.habitual_residence
      span: Appealing a decision on habitual residency
    - source_id: crosscare.habitual_residence
      span: Refusal Process

# --- health ----------------------------------------------------------------

- id: gp.register
  title: Register with a GP
  domain: health
  why: >
    A GP is the way in to the rest of the health system. You do not have to wait
    for the medical card to register.
  blocking_severity: important
  where:
    - source_id: hse.medical_cards
      span: About the medical card

- id: medical_card.renew
  title: Renew your medical card before it runs out
  domain: health
  why: >
    A card that runs out takes weeks to get back. In that time you pay for your
    own prescriptions.
  requires:
    - document:medical_card
  blocking_severity: routine
  where:
    - source_id: hse.medical_cards
      span: Managing your medical card

# --- education -------------------------------------------------------------

- id: school.enrol_primary
  title: Enrol your child in primary school
  domain: education
  why: >
    Schools fill up from the spring. A place is easier to get before the year
    starts.
  applies_when:
    child_aged:
      min: 4
      max: 12
  requires:
    - any_of: [document:birth_certificate, document:temporary_residence_certificate]
      note: Schools ask for proof of the child's age and identity.
  produces:
    - document:school_place
  typical_wait: P30D
  blocking_severity: critical
  where:
    - source_id: irc.education
      span: Key Findings

- id: school.enrol_secondary
  title: Enrol your child in secondary school
  domain: education
  why: >
    Secondary schools give out places earlier than primary schools do. Often a
    full year ahead.
  applies_when:
    child_aged:
      min: 12
      max: 18
  requires:
    - any_of: [document:birth_certificate, document:temporary_residence_certificate]
  produces:
    - document:school_place
  typical_wait: P30D
  blocking_severity: critical
  where:
    - source_id: irc.education
      span: Key Findings

- id: english.classes
  title: Ask an ETB about free English classes
  domain: education
  why: >
    Ask the guidance counsellor at your local Education and Training Board. They
    know what is running near you. The classes are free.
  produces:
    - status:english_class_place
  typical_wait: P21D
  blocking_severity: important
  where:
    - source_id: irc.education
      span: Support Resources

- id: further_education.enrol
  title: Ask about a further education course
  domain: education
  why: >
    A level 5 course is the usual way in to higher education here. What you pay
    depends on whether you have permission to work.
  requires:
    - ref: status:labour_market_access
      note: >
        Not a hard requirement for a place. It changes the fee substantially,
        which is why it is worth sorting first if you can.
  produces:
    - status:further_education_place
  typical_wait: P60D
  blocking_severity: routine
  where:
    - source_id: irc.education
      span: Further Education (Levels 5-6)

- id: thirdlevel.support
  title: Ask about support for third level study
  domain: education
  why: >
    Most funding has a waiting period. It is worth knowing the exact date it
    opens to you.
  requires:
    - any_of: [elapsed:protection_application_date]
      after: P1095D
      note: >
        Nasc describes a three year wait before financial supports for further
        or third level education are available to people in the asylum process.
  blocking_severity: routine
  where:
    - source_id: nasc.education
      span: Third Level Education Barriers
    - source_id: irc.education
      span: Funding Options

# --- banking ---------------------------------------------------------------

- id: bank.basic_account
  title: Open a basic bank account
  domain: banking
  why: >
    Payments cannot reach you without an account. A basic account is made for
    people who cannot meet the usual requirements.
  requires:
    - document:ppsn
    - any_of: [document:proof_of_address, document:temporary_residence_certificate]
      note: One of these is usually accepted as proof of who you are and where you live.
  produces:
    - status:basic_bank_account
  typical_wait: P7D
  blocking_severity: important
  where:
    - source_id: irc.homeless
      span: Securing Proof of Address
