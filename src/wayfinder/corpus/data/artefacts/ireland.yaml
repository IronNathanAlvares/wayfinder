- ref: document:national_id
  title: a national identity document or passport
  note: >
    A primitive. Some people arrive holding one and some do not, and no task in
    this corpus produces it.

- ref: document:temporary_residence_certificate
  title: your Temporary Residence Certificate, sometimes called the blue card
  note: Issued after the international protection application is made.

- ref: document:asylum_application_letter
  title: the letter confirming you applied for international protection
  note: >
    Used as proof of being on the IPAS waiting list, which several other things
    ask for.

- ref: document:ppsn
  title: your PPS number
  note: Almost everything in the welfare system is keyed on this.

- ref: document:proof_of_address
  title: proof of your address

- ref: document:medical_card
  title: a medical card

- ref: status:labour_market_access
  title: permission to work

- ref: determination:ipas_accommodation_offer
  title: an offer of accommodation from IPAS
  decided_by: the International Protection Accommodation Service
  note: >
    Modelled as a determination rather than a task because nobody applying can
    make it happen. IPAS contacts people from a waiting list. Naming who decides
    it, and refusing to guess when or whether it will come, is the point.

- ref: determination:habitual_residence
  title: the habitual residence condition
  decided_by: the Department of Social Protection
  note: >
    The canonical determination in this domain, and the reason this system
    exists in the shape it does. Five factors, no requirement to satisfy all of
    them, and the question is where a person's main centre of interest lies.
    That is a judgement made by a named authority. It is not ours, and it is not
    something a plan engine can compute.

- ref: determination:protection_outcome
  title: a grant of international protection
  decided_by: the International Protection Office
  note: >
    Modelled as a determination rather than a status somebody holds, because
    nothing the person does makes it happen and nothing this system knows
    predicts it.

- ref: status:ipas_accommodation
  title: a place in IPAS accommodation
  note: >
    Being housed is a thing you hold, not a task that stops applying. Modelling
    it this way is what makes taking up an offer read as done rather than as
    "no longer on your list", which for somebody who has just been housed reads
    as something being taken away.

- ref: document:school_place
  title: an offer of a school place

- ref: document:proof_of_income
  title: proof of your income

- ref: document:birth_certificate
  title: a birth certificate for your child

- ref: status:basic_bank_account
  title: a basic bank account

- ref: status:english_class_place
  title: a place in an English class

- ref: status:further_education_place
  title: a place on a further education course
