# The crisis services directory. Static, dated, never generated.
#
# Every number here was read on 18 August 2026 from the publishing
# organisation's own site. A number that could not be verified that way is not
# in this file, whatever else is known about it.
#
# The emergency number leads every section on purpose. Several of these services
# keep office hours, and "I have nowhere to sleep tonight" is most often typed
# after they close. Showing a freephone without its hours sends somebody to a
# phone that will not be answered, which is why `hours` is a required field.
#
# Not covered, and stated rather than hidden: there is no dedicated
# anti-trafficking line in this directory, because none could be verified
# against a publisher's own page at build time. Trafficking is routed to the
# Garda emergency and confidential lines instead, which is worse than a
# specialist service and better than a number nobody checked.

reviewed_on: 2026-08-18
reviewed_by: NA

sections:
  - category: self_harm
    lead_line: >-
      If you are thinking about ending your life, please talk to somebody now.
      These lines are free and open through the night.
    entries:
      - id: emergency
        name: Emergency services
        contact: 999 or 112
        hours: 24 hours, every day
        covers: If you are in immediate danger.
        url: https://www.garda.ie/en/contact-us/
        last_verified: 2026-08-18
        verified_by: NA
      - id: pieta
        name: Pieta
        contact: Freephone 1800 247 247, or text HELP to 51444
        hours: 24 hours, every day
        covers: Crisis support around suicide and self-harm.
        url: https://www.pieta.ie/
